state:
  ode:
    _type: process
    address: local:OdeProcess
    config:
      rhs:
        TGFb_R1_surface: (-Active_R2*TGFb_R1_surface*cyt*kf_R1_activation + Active_Rec*cyt*index_kb_R1*kf_R1_activation
          + R1_total_C3*cyt*k_in_R1_C3*kdeg_R1**2.0/(index_k_out_1_relative_speed_C3*k_in_R1_C3*kdeg_R1
          + k_in_R1_C3*kdeg_R1 + kdeg_R1**2.0) + TGFb_R1_endo*cyt*index_k_out_1_relative_speed_C3*k_in_R1_C3
          - TGFb_R1_surface*cyt*k_in_R1_C3)/cyt
        TGFb_R2_surface: (Active_R2*cyt*index_kb_R2*kf_R2_activation + R2_total_C3*cyt*k_in_R2_C3*kdeg_R2**2.0/(index_k_out_2_relative_speed_C3*k_in_R2_C3*kdeg_R2
          + k_in_R2_C3*kdeg_R2 + kdeg_R2**2.0) - TGFb*TGFb_R2_surface*cyt*kf_R2_activation
          + TGFb_R2_endo*cyt*index_k_out_2_relative_speed_C3*k_in_R2_C3 - TGFb_R2_surface*cyt*k_in_R2_C3)/cyt
        TGFb_R1_endo: (Active_Rec_endo*cyt*k_disso_Active_Rec + Active_Rec_endo*cyt*kdeg_R2
          + Active_Rec_endo*cyt*kin_deg_Ligand + Inactive_Rec*cyt*index_induced_R2_deg*kdeg_R2
          + Inactive_Rec*cyt*index_induced_ligand_deg*kin_deg_Ligand - TGFb_R1_endo*cyt*index_k_out_1_relative_speed_C3*k_in_R1_C3
          - TGFb_R1_endo*cyt*kdeg_R1 + TGFb_R1_surface*cyt*k_in_R1_C3)/cyt
        TGFb_R2_endo: (Active_Rec_endo*cyt*k_disso_Active_Rec + Active_Rec_endo*cyt*kdeg_R1
          + Active_Rec_endo*cyt*kin_deg_Ligand + Inactive_Rec*cyt*index_induced_ligand_deg*kin_deg_Ligand
          - TGFb_R2_endo*cyt*index_k_out_2_relative_speed_C3*k_in_R2_C3 - TGFb_R2_endo*cyt*kdeg_R2
          + TGFb_R2_surface*cyt*k_in_R2_C3)/cyt
        TGFb: (Active_R2*cyt*index_kb_R2*kf_R2_activation/k_medium - TGFb*TGFb_R2_surface*cyt*kf_R2_activation/k_medium
          - TGFb*cyt*kout_deg_Ligand_100pM)/cyt
        TGFb_In: (Active_Rec_endo*cyt*k_disso_Active_Rec + Active_Rec_endo*cyt*kdeg_R1
          + Active_Rec_endo*cyt*kdeg_R2 + Inactive_Rec*cyt*index_induced_R2_deg*kdeg_R2
          - TGFb_In*cyt*kin_deg_Ligand)/cyt
        Active_R2: (-Active_R2*TGFb_R1_surface*cyt*kf_R1_activation - Active_R2*cyt*index_kb_R2*kf_R2_activation
          + Active_Rec*cyt*index_kb_R1*kf_R1_activation + TGFb*TGFb_R2_surface*cyt*kf_R2_activation)/cyt
        Active_Rec: (Active_R2*TGFb_R1_surface*cyt*kf_R1_activation - Active_Rec*S7*cyt*kf_Seq_S7_Rec
          - Active_Rec*cyt*index_active_Rec_internalize_C3*k_in_R1_C3 - Active_Rec*cyt*index_kb_R1*kf_R1_activation
          + Inactive_Rec*cyt*index_seq_kb*kf_Seq_S7_Rec)/cyt
        Active_Rec_endo: (Active_Rec*cyt*index_active_Rec_internalize_C3*k_in_R1_C3
          - Active_Rec_endo*cyt*k_disso_Active_Rec - Active_Rec_endo*cyt*kdeg_R1 -
          Active_Rec_endo*cyt*kdeg_R2 - Active_Rec_endo*cyt*kin_deg_Ligand)/cyt
        Inactive_Rec: (Active_Rec*S7*cyt*kf_Seq_S7_Rec - Inactive_Rec*cyt*index_induced_R2_deg*kdeg_R2
          - Inactive_Rec*cyt*index_induced_ligand_deg*kin_deg_Ligand - Inactive_Rec*cyt*index_seq_kb*kf_Seq_S7_Rec)/cyt
        pS2_c: (Active_Rec_endo*S2_c*cyt*k_phosphorylation + S2_export_from_nuc_C3*nuc*pS2_n
          - S2_import_to_nuc_C3*cyt*pS2_c - 2*S4_c*cyt*kf_trimmer*pS2_c**2.0 + 3*cyt*index_kb_homotrimer*kb_trimmer*pS2_pS2_pS2_c
          - 3*cyt*index_kf_homotrimer*kf_trimmer*pS2_c**3.0 + 2*cyt*kb_trimmer*pS2_pS2_S4_c
          - cyt*kdeg_S2*pS2_c + cyt*kdeg_S2*pS2_pS2_S4_c + 2*cyt*kdeg_S2*pS2_pS2_pS2_c
          + 2*cyt*kdeg_S4*pS2_pS2_S4_c)/cyt
        S2_c: (-Active_Rec_endo*S2_c*cyt*k_phosphorylation - S2_c*S2_import_to_nuc_C3*cyt
          - S2_c*cyt*kdeg_S2 + S2_export_from_nuc_C3*S2_n*nuc + S2_total_C3*cyt*(S2_export_from_nuc_C3*kdeg_S2
          + S2_import_to_nuc_C3*kdeg_S2 + kdeg_S2**2.0)/(S2_export_from_nuc_C3 + 2.0*S2_import_to_nuc_C3
          + kdeg_S2))/cyt
        S4_c: (-S4_c*S4_import_to_nuc_C3*cyt - S4_c*cyt*kdeg_S4 - S4_c*cyt*kf_trimmer*pS2_c**2.0
          + S4_export_from_nuc_C3*S4_n*nuc + S4_total_C3*cyt*(S4_export_from_nuc_C3*kdeg_S4
          + S4_import_to_nuc_C3*kdeg_S4 + kdeg_S4**2.0)/(S4_export_from_nuc_C3 + 2.0*S4_import_to_nuc_C3
          + kdeg_S4) + cyt*kb_trimmer*pS2_pS2_S4_c + cyt*kdeg_S2*pS2_pS2_S4_c)/cyt
        pS2_pS2_S4_c: (S4_c*cyt*kf_trimmer*pS2_c**2.0 - Trimer_import_to_nuc*cyt*pS2_pS2_S4_c
          - cyt*kb_trimmer*pS2_pS2_S4_c - cyt*kdeg_S2*pS2_pS2_S4_c - cyt*kdeg_S4*pS2_pS2_S4_c)/cyt
        pS2_pS2_pS2_c: (-Trimer_import_to_nuc*cyt*pS2_pS2_pS2_c - cyt*index_kb_homotrimer*kb_trimmer*pS2_pS2_pS2_c
          + cyt*index_kf_homotrimer*kf_trimmer*pS2_c**3.0 - cyt*kdeg_S2*pS2_pS2_pS2_c)/cyt
        Smad7mRNA: (-Smad7mRNA*cyt*kmRNAdeg_S7 + Smad7mRNA1*export_cytoplasm*nuc)/cyt
        Smad7mRNA1: (DRB*S7KD*nuc*(k_induced_S7_production_C3*pS2_pS2_S4_n**hill_fact1/(K_mran**hill_fact1
          + pS2_pS2_S4_n**hill_fact1) + mRNA_prod_C3) - Smad7mRNA1*export_cytoplasm*nuc
          - Smad7mRNA1*kmRNA1deg_S7*nuc)/nuc
        S7: (-Active_Rec*S7*cyt*kf_Seq_S7_Rec + Inactive_Rec*cyt*index_induced_R2_deg*kdeg_R2
          + Inactive_Rec*cyt*index_induced_ligand_deg*kin_deg_Ligand + Inactive_Rec*cyt*index_seq_kb*kf_Seq_S7_Rec
          - S7*cyt*kdeg_S7 + Smad7mRNA*cyt*k_S7_protein_C3)/cyt
        pS2_n: (-S2_export_from_nuc_C3*nuc*pS2_n + S2_import_to_nuc_C3*cyt*pS2_c -
          2*S4_n*kf_trimmer*nuc*pS2_n**2.0 + 3*index_kb_homotrimer*kb_trimmer*nuc*pS2_pS2_pS2_n
          - 3*index_kf_homotrimer*kf_trimmer*nuc*pS2_n**3.0 + index_trimer_dephos*k_Dephos_C3*nuc*pS2_pS2_S4_n
          - k_Dephos_C3*nuc*pS2_n + 2*kb_trimmer*nuc*pS2_pS2_S4_n - kdeg_S2*nuc*pS2_n
          + kdeg_S2*nuc*pS2_pS2_S4_n + 2*kdeg_S2*nuc*pS2_pS2_pS2_n + 2*kdeg_S4*nuc*pS2_pS2_S4_n)/nuc
        pS2_pS2_S4_n: (S4_n*kf_trimmer*nuc*pS2_n**2.0 + Trimer_import_to_nuc*cyt*pS2_pS2_S4_c
          - index_trimer_dephos*k_Dephos_C3*nuc*pS2_pS2_S4_n - kb_trimmer*nuc*pS2_pS2_S4_n
          - kdeg_S2*nuc*pS2_pS2_S4_n - kdeg_S4*nuc*pS2_pS2_S4_n)/nuc
        pS2_pS2_pS2_n: (Trimer_import_to_nuc*cyt*pS2_pS2_pS2_c - index_kb_homotrimer*kb_trimmer*nuc*pS2_pS2_pS2_n
          + index_kf_homotrimer*kf_trimmer*nuc*pS2_n**3.0 - kdeg_S2*nuc*pS2_pS2_pS2_n)/nuc
        S2_n: (S2_c*S2_import_to_nuc_C3*cyt - S2_export_from_nuc_C3*S2_n*nuc - S2_n*kdeg_S2*nuc
          + index_trimer_dephos*k_Dephos_C3*nuc*pS2_pS2_S4_n + k_Dephos_C3*nuc*pS2_n)/nuc
        S4_n: (S4_c*S4_import_to_nuc_C3*cyt - S4_export_from_nuc_C3*S4_n*nuc - S4_n*kdeg_S4*nuc
          - S4_n*kf_trimmer*nuc*pS2_n**2.0 + index_trimer_dephos*k_Dephos_C3*nuc*pS2_pS2_S4_n
          + kb_trimmer*nuc*pS2_pS2_S4_n + kdeg_S2*nuc*pS2_pS2_S4_n)/nuc
      params:
        cyt: ${cyt}
        nuc: ${nuc}
        DRB: ${DRB}
        K_mran: ${K_mran}
        R1_total_C3: ${R1_total_C3}
        R2_total_C3: ${R2_total_C3}
        S2_export_from_nuc_C3: ${S2_export_from_nuc_C3}
        S2_import_to_nuc_C3: ${S2_import_to_nuc_C3}
        S2_total_C3: ${S2_total_C3}
        S4_export_from_nuc_C3: ${S4_export_from_nuc_C3}
        S4_import_to_nuc_C3: ${S4_import_to_nuc_C3}
        S4_total_C3: ${S4_total_C3}
        S7KD: ${S7KD}
        Trimer_import_to_nuc: ${Trimer_import_to_nuc}
        export_cytoplasm: ${export_cytoplasm}
        hill_fact1: ${hill_fact1}
        index_active_Rec_internalize_C3: ${index_active_Rec_internalize_C3}
        index_induced_R2_deg: ${index_induced_R2_deg}
        index_induced_ligand_deg: ${index_induced_ligand_deg}
        index_k_out_1_relative_speed_C3: ${index_k_out_1_relative_speed_C3}
        index_k_out_2_relative_speed_C3: ${index_k_out_2_relative_speed_C3}
        index_kb_R1: ${index_kb_R1}
        index_kb_R2: ${index_kb_R2}
        index_kb_homotrimer: ${index_kb_homotrimer}
        index_kf_homotrimer: ${index_kf_homotrimer}
        index_seq_kb: ${index_seq_kb}
        index_trimer_dephos: ${index_trimer_dephos}
        k_Dephos_C3: ${k_Dephos_C3}
        k_S7_protein_C3: ${k_S7_protein_C3}
        k_disso_Active_Rec: ${k_disso_Active_Rec}
        k_in_R1_C3: ${k_in_R1_C3}
        k_in_R2_C3: ${k_in_R2_C3}
