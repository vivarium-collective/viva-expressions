state:
  ode:
    _type: process
    address: local:OdeProcess
    config:
      rhs:
        Rb: (-Cell*Rb*(Ca*kPhRbCa + Cd*kPhRbCd + Ce*kPhRbCe) + Cell*RbE2f*kDeE2f +
          Cell*kDpRb*pRb - Cell*(E2f*Rb*kAsRbE2f - RbE2f*kDsRbE2f))/Cell
        pRb: (Cell*Rb*(Ca*kPhRbCa + Cd*kPhRbCd + Ce*kPhRbCe) + Cell*RbE2f*(Ca*kPhRbCa
          + Cd*kPhRbCd + Ce*kPhRbCe) - Cell*kDpRb*pRb)/Cell
        E2f: (-Cell*E2f*kDeE2f + Cell*RbE2f*(Ca*kPhRbCa + Cd*kPhRbCd + Ce*kPhRbCe)
          - Cell*(E2f*Rb*kAsRbE2f - RbE2f*kDsRbE2f) + Cell*(E2f*kSyE2fE2f/(E2f + jSyE2f)
          + kSyE2f))/Cell
        RbE2f: (-Cell*RbE2f*kDeE2f - Cell*RbE2f*(Ca*kPhRbCa + Cd*kPhRbCd + Ce*kPhRbCe)
          + Cell*(E2f*Rb*kAsRbE2f - RbE2f*kDsRbE2f))/Cell
        E1: (-Cell*E1*kDeE1 + Cell*E1C1*(Ca*kPhC1Ca + Ce*kPhC1Ce + kPhC1) + Cell*E2f*kSyE1
          - Cell*(C1*E1*kAsE1C1 - E1C1*kDsE1C1))/Cell
        C1: (-C1*Cell*(Ca*kPhC1Ca + Ce*kPhC1Ce + kPhC1) + Cell*E1C1*kDeE1C1 + Cell*kDpC1*pC1
          - Cell*(C1*E1*kAsE1C1 - E1C1*kDsE1C1))/Cell
        pC1: (C1*Cell*(Ca*kPhC1Ca + Ce*kPhC1Ce + kPhC1) + Cell*E1C1*(Ca*kPhC1Ca +
          Ce*kPhC1Ce + kPhC1) - Cell*kDpC1*pC1)/Cell
        E1C1: (-Cell*E1C1*kDeE1C1 - Cell*E1C1*(Ca*kPhC1Ca + Ce*kPhC1Ce + kPhC1) +
          Cell*(C1*E1*kAsE1C1 - E1C1*kDsE1C1))/Cell
        P21: (CaP21*Cell*(C1*kDeCaC1 + kDeCa) + CeP21*Cell*(Ca*kDeCeCa + kDeCe) -
          Cell*P21*(Cdt2*aRc*kDeP21aRc + Skp2*kDeP21Cy*(Ca + Ce) + kDeP21) + Cell*iPcna*kExPc
          + Cell*(P53*kSyP21P53 + kSyP21) - Cell*(Ca*P21*kAsCyP21 - CaP21*kDsCyP21)
          - Cell*(Ce*P21*kAsCyP21 - CeP21*kDsCyP21) - Cell*(P21*aPcna*kAsPcP21 - iPcna*kDsPcP21)
          - Cell*(P21*aRc*kAsPcP21 - iRc*kDsPcP21))/Cell
        Ce: (-Ce*Cell*(Ca*kDeCeCa + kDeCe) + CeP21*Cell*(Cdt2*aRc*kDeP21aRc + Skp2*kDeP21Cy*(Ca
          + Ce) + kDeP21) + Cell*E2f*kSyCe - Cell*(Ce*P21*kAsCyP21 - CeP21*kDsCyP21))/Cell
        Ca: (-Ca*Cell*(C1*kDeCaC1 + kDeCa) + CaP21*Cell*(Cdt2*aRc*kDeP21aRc + Skp2*kDeP21Cy*(Ca
          + Ce) + kDeP21) + Cell*E2f*kSyCa - Cell*(Ca*P21*kAsCyP21 - CaP21*kDsCyP21))/Cell
        CeP21: (-CeP21*Cell*(Ca*kDeCeCa + kDeCe) - CeP21*Cell*(Cdt2*aRc*kDeP21aRc
          + Skp2*kDeP21Cy*(Ca + Ce) + kDeP21) + Cell*(Ce*P21*kAsCyP21 - CeP21*kDsCyP21))/Cell
        CaP21: (-CaP21*Cell*(C1*kDeCaC1 + kDeCa) - CaP21*Cell*(Cdt2*aRc*kDeP21aRc
          + Skp2*kDeP21Cy*(Ca + Ce) + kDeP21) + Cell*(Ca*P21*kAsCyP21 - CaP21*kDsCyP21))/Cell
        aPcna: (-Cell*aPcna*kExPc + Cell*iPcna*(Cdt2*aRc*kDeP21aRc + Skp2*kDeP21Cy*(Ca
          + Ce) + kDeP21) + Cell*kImPc - Cell*(P21*aPcna*kAsPcP21 - iPcna*kDsPcP21)
          - Cell*(aPcna*kAsRcPc*pRc - aRc*kDsRcPc) + Cell*Piecewise((0.0, Dna < 1.0),
          (Piecewise((1.0*aRc, Dna > 1.0), (0.5*aRc, True)), True)))/Cell
        iPcna: (-Cell*iPcna*kExPc - Cell*iPcna*(Cdt2*aRc*kDeP21aRc + Skp2*kDeP21Cy*(Ca
          + Ce) + kDeP21) + Cell*(P21*aPcna*kAsPcP21 - iPcna*kDsPcP21) - Cell*(iPcna*kAsRcPc*pRc
          - iRc*kDsRcPc) + Cell*Piecewise((0.0, Dna < 1.0), (Piecewise((1.0*iRc, Dna
          > 1.0), (0.5*iRc, True)), True)))/Cell
        Rc: (-Cell*Rc*kPhRc*(Ca + Ce)**n/(jCy**n + (Ca + Ce)**n) + Cell*kDpRc*pRc
          - Cell*Piecewise((0.0, Dna < 1.0), (Piecewise((1.0*Rc, Dna > 1.0), (0.5*Rc,
          True)), True)))/Cell
        pRc: (Cell*Rc*kPhRc*(Ca + Ce)**n/(jCy**n + (Ca + Ce)**n) - Cell*kDpRc*pRc
          - Cell*(aPcna*kAsRcPc*pRc - aRc*kDsRcPc) - Cell*(iPcna*kAsRcPc*pRc - iRc*kDsRcPc)
          - Cell*Piecewise((0.0, Dna < 1.0), (Piecewise((1.0*pRc, Dna > 1.0), (0.5*pRc,
          True)), True)))/Cell
        aRc: (Cell*iRc*(Cdt2*aRc*kDeP21aRc + Skp2*kDeP21Cy*(Ca + Ce) + kDeP21) - Cell*(P21*aRc*kAsPcP21
          - iRc*kDsPcP21) + Cell*(aPcna*kAsRcPc*pRc - aRc*kDsRcPc) - Cell*Piecewise((0.0,
          Dna < 1.0), (Piecewise((1.0*aRc, Dna > 1.0), (0.5*aRc, True)), True)))/Cell
        iRc: (-Cell*iRc*(Cdt2*aRc*kDeP21aRc + Skp2*kDeP21Cy*(Ca + Ce) + kDeP21) +
          Cell*(P21*aRc*kAsPcP21 - iRc*kDsPcP21) + Cell*(iPcna*kAsRcPc*pRc - iRc*kDsRcPc)
          - Cell*Piecewise((0.0, Dna < 1.0), (Piecewise((1.0*iRc, Dna > 1.0), (0.5*iRc,
          True)), True)))/Cell
        Dna: aRc*kSyDna
        P53: (-Cell*P53*kDeP53/(Dam + jP53) + Cell*kSyP53)/Cell
        Dam: (-Cell*Dam*(P53*kReDamP53/(Dam + jDam) + kReDam) + Cell*aRc*kGeDamArc
          + Cell*kGeDam)/Cell
        Pr: (-Cell*Pr*(C1*kDeCaC1 + kDePr) + Cell*kSyPr)/Cell
      params:
        Cell: ${Cell}
        Cd: ${Cd}
        Skp2: ${Skp2}
        Cdt2: ${Cdt2}
        kSyE2f: ${kSyE2f}
        kSyE2fE2f: ${kSyE2fE2f}
        jSyE2f: ${jSyE2f}
        kAsRbE2f: ${kAsRbE2f}
        kDsRbE2f: ${kDsRbE2f}
        kDeE2f: ${kDeE2f}
        kPhRbCd: ${kPhRbCd}
        kPhRbCe: ${kPhRbCe}
        kPhRbCa: ${kPhRbCa}
        kDpRb: ${kDpRb}
        kSyE1: ${kSyE1}
        kDeE1C1: ${kDeE1C1}
        kDeE1: ${kDeE1}
        kPhC1: ${kPhC1}
        kPhC1Ce: ${kPhC1Ce}
        kPhC1Ca: ${kPhC1Ca}
        kDpC1: ${kDpC1}
        kAsE1C1: ${kAsE1C1}
        kDsE1C1: ${kDsE1C1}
        kSyP21: ${kSyP21}
        kSyP21P53: ${kSyP21P53}
        kDeP21: ${kDeP21}
        kDeP21Cy: ${kDeP21Cy}
        kDeP21aRc: ${kDeP21aRc}
        kSyCe: ${kSyCe}
        kSyCa: ${kSyCa}
        kAsCyP21: ${kAsCyP21}
        kDsCyP21: ${kDsCyP21}
        kDeCe: ${kDeCe}
        kDeCa: ${kDeCa}
        kDeCeCa: ${kDeCeCa}
        kDeCaC1: ${kDeCaC1}
        kImPc: ${kImPc}
        kExPc: ${kExPc}
        kPhRc: ${kPhRc}
        kDpRc: ${kDpRc}
        jCy: ${jCy}
        n: ${n}
        kAsRcPc: ${kAsRcPc}
        kDsRcPc: ${kDsRcPc}
        kAsPcP21: ${kAsPcP21}
        kDsPcP21: ${kDsPcP21}
        kSyDna: ${kSyDna}
        kSyP53: ${kSyP53}
        kDeP53: ${kDeP53}
        jP53: ${jP53}
        kGeDam: ${kGeDam}
        kGeDamArc: ${kGeDamArc}
        kReDam: ${kReDam}
        kReDamP53: ${kReDamP53}
