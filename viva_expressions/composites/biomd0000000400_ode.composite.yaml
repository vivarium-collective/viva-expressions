    default: 1.0
    description: SBML parameter 'kf6' (held constant).
  kf7:
    type: float
    default: 0.15
    description: SBML parameter 'kf7' (held constant).
  kf8:
    type: float
    default: 0.0167
    description: SBML parameter 'kf8' (held constant).
  kr8:
    type: float
    default: 0.0167
    description: SBML parameter 'kr8' (held constant).
  kf9:
    type: float
    default: 0.0042
    description: SBML parameter 'kf9' (held constant).
  kr9:
    type: float
    default: 1.0
    description: SBML parameter 'kr9' (held constant).
  kf10:
    type: float
    default: 0.042
    description: SBML parameter 'kf10' (held constant).
  kr10:
    type: float
    default: 1.0
    description: SBML parameter 'kr10' (held constant).
  kf11:
    type: float
