    J5: 0.0
    J6: 0.0
  assignments:
    _type: step
    address: local:MathExpressionStep
    config:
      expressions:
      - out: Cc
        expr: 0.0016605778811026237/Vc
      - out: Cp
        expr: 1.0/(Rpc*Vc)
      - out: Cpc
        expr: Cc/Cp
      - out: J13
        expr: Pg*kf13
      - out: J12
        expr: Pcg*kf12
      - out: kr11
        expr: Kd11*kf11
      - out: J11
        expr: Ca*Pg*kf11 - Pcg*kr11
      - out: J10
        expr: Gt*Pc*kf10 - Pcg*kr10
      - out: J8
        expr: Ca*P*kf8 - Pc*kr8
      - out: J9
        expr: Gt*P*kf9 - Pg*kr9
      - out: J16
        expr: IP3*kf16
      - out: J14
        expr: PIP2*Pc*kf14/(PIP2 + Km14/Cpc)
      - out: J15
        expr: PIP2*Pcg*kf15/(PIP2 + Km15/Cpc)
      - out: J7
        expr: Gt*kf7
      - out: L
        expr: Piecewise((Ls/(54.598150033144236*exp(-80.0*time + 80.0*ts) + 1.0),
          (time >= ts) & (time < ts + 0.15)), (Ls, time >= ts + 0.15), (0.0, True))
      - out: kr1
        expr: Kd1*kf1
      - out: J1
        expr: L*R*kf1 - Rl*kr1
      - out: kr2
        expr: Kd2*kf2
      - out: J2
        expr: Gd*R*kf2 - Rg*kr2
      - out: J3
        expr: Gd*Rl*kf3 - Rlg*kr3
      - out: kr4
        expr: Kd4*kf4
      - out: J4
        expr: L*Rg*kf4 - Rlg*kr4
      - out: J5
        expr: Rlg*kf5
      - out: J6
        expr: Rlg*kf6
      params:
        Compartment: ${Compartment}
        Ls: ${Ls}
        ts: ${ts}
        PIP2: ${PIP2}
        kf1: ${kf1}
        Kd1: ${Kd1}
        kf2: ${kf2}
        Kd2: ${Kd2}
        kf3: ${kf3}
        kr3: ${kr3}
