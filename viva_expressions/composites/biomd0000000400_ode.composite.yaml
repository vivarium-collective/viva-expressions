name: biomd0000000400_ode
description: 'SBML model ''Cooling2007_IP3transients_CardiacMyocyte'' imported into
  OdeProcess. Source: BIOMD0000000400. time-dependent model: added state ''time''
  with dtime/dt = 1 from time = 0'
tags:
- ode
- expressions
- sbml-import
requires:
  processes:
  - OdeProcess
  - MathExpressionStep
parameters:
  Compartment:
    type: float
    default: 1.0
    description: SBML compartment 'Compartment' (held constant).
  Ls:
    type: float
    default: 0.1
    description: SBML parameter 'Ls' (held constant).
  ts:
    type: float
    default: 30.0
    description: SBML parameter 'ts' (held constant).
  PIP2:
    type: float
    default: 4000.0
    description: SBML parameter 'PIP2' (held constant).
  kf1:
    type: float
    default: 0.0003
    description: SBML parameter 'kf1' (held constant).
  Kd1:
    type: float
    default: 3.0e-05
    description: SBML parameter 'Kd1' (held constant).
  kf2:
    type: float
    default: 0.000275
    description: SBML parameter 'kf2' (held constant).
  Kd2:
    type: float
    default: 27500.0
    description: SBML parameter 'Kd2' (held constant).
  kf3:
    type: float
    default: 1.0
    description: SBML parameter 'kf3' (held constant).
  kr3:
    type: float
    default: 0.001
    description: SBML parameter 'kr3' (held constant).
  kf4:
    type: float
    default: 0.3
    description: SBML parameter 'kf4' (held constant).
  Kd4:
    type: float
    default: 3.0e-05
    description: SBML parameter 'Kd4' (held constant).
  kf5:
    type: float
    default: 0.0004
    description: SBML parameter 'kf5' (held constant).
  kf6:
