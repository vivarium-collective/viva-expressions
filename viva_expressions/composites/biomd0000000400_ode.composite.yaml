    type: float
    default: 2550.0
    description: SBML parameter 'Vc' (held constant).
  Rpc:
    type: float
    default: 4.61
    description: SBML parameter 'Rpc' (held constant).
  Gd_0:
    type: float
    default: 10000.0
    description: Initial value of Gd (concentration).
  Gt_0:
    type: float
    default: 0.0
    description: Initial value of Gt (concentration).
  R_0:
    type: float
    default: 13.9
    description: Initial value of R (concentration).
  Rl_0:
    type: float
    default: 0.0
    description: Initial value of Rl (concentration).
  Rg_0:
    type: float
    default: 5.06
    description: Initial value of Rg (concentration).
  Rlg_0:
    type: float
    default: 0.0
    description: Initial value of Rlg (concentration).
  Rlgp_0:
    type: float
    default: 0.0
    description: Initial value of Rlgp (concentration).
  IP3_0:
    type: float
    default: 0.015
    description: Initial value of IP3 (concentration).
  Pc_0:
    type: float
    default: 9.09
    description: Initial value of Pc (concentration).
  Pcg_0:
    type: float
