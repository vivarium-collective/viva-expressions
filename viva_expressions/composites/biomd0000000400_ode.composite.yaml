    type: float
    default: 90.9
    description: Initial value of P (concentration).
  Pg_0:
    type: float
    default: 0.0
    description: Initial value of Pg (concentration).
  Ca_0:
    type: float
    default: 0.1
    description: Initial value of Ca (concentration).
  time_0:
    type: float
    default: 0.0
    description: Initial value of time (time).
  method:
    type: string
    default: LSODA
    description: scipy solve_ivp method (LSODA, RK45, DOP853, Radau, BDF).
  rtol:
    type: float
    default: 1.0e-08
    description: Solver relative tolerance.
  atol:
    type: float
    default: 1.0e-10
    description: Solver absolute tolerance.
state:
  ode:
    _type: process
    address: local:OdeProcess
    config:
      rhs:
        Gd: -Gd*R*kf2 - Gd*Rl*kf3 + Gt*kf7 + Kd2*Rg*kf2 + Pcg*kf12 + Pg*kf13 + Rlg*kr3
        Gt: -Gt*P*kf9 - Gt*Pc*kf10 - Gt*kf7 + Pcg*kr10 + Pg*kr9 + Rlg*kf6
        R: -1.0*Gd*R*kf2 + 1.0*Kd1*Rl*kf1 + 1.0*Kd2*Rg*kf2 - 1.0*R*kf1*Piecewise((Ls/(54.598150033144236*exp(-80.0*time
          + 80.0*ts) + 1.0), (time >= ts) & (time < ts + 0.15)), (Ls, time >= ts +
          0.15), (0.0, True))
        Rl: -Gd*Rl*kf3 - Kd1*Rl*kf1 + R*kf1*Piecewise((Ls/(54.598150033144236*exp(-80.0*time
          + 80.0*ts) + 1.0), (time >= ts) & (time < ts + 0.15)), (Ls, time >= ts +
          0.15), (0.0, True)) + Rlg*kf6 + Rlg*kr3
        Rg: Gd*R*kf2 - Kd2*Rg*kf2 + Kd4*Rlg*kf4 - Rg*kf4*Piecewise((Ls/(54.598150033144236*exp(-80.0*time
          + 80.0*ts) + 1.0), (time >= ts) & (time < ts + 0.15)), (Ls, time >= ts +
          0.15), (0.0, True))
        Rlg: Gd*Rl*kf3 - Kd4*Rlg*kf4 + Rg*kf4*Piecewise((Ls/(54.598150033144236*exp(-80.0*time
          + 80.0*ts) + 1.0), (time >= ts) & (time < ts + 0.15)), (Ls, time >= ts +
          0.15), (0.0, True)) - Rlg*kf5 - Rlg*kf6 - Rlg*kr3
        Rlgp: Rlg*kf5
        IP3: -IP3*kf16 + 0.0016605778811026237*Rpc*(PIP2*Pc*kf14/(602.2*Km14/Rpc +
          PIP2) + PIP2*Pcg*kf15/(602.2*Km15/Rpc + PIP2))
        Pc: Ca*P*kf8 - Gt*Pc*kf10 - Pc*kr8 + Pcg*kf12 + Pcg*kr10
        Pcg: Ca*Pg*kf11 + Gt*Pc*kf10 - Kd11*Pcg*kf11 - Pcg*kf12 - Pcg*kr10
        P: -Ca*P*kf8 - Gt*P*kf9 + Pc*kr8 + Pg*kf13 + Pg*kr9
        Pg: -Ca*Pg*kf11 + Gt*P*kf9 + Kd11*Pcg*kf11 - Pg*kf13 - Pg*kr9
        Ca: -0.0016605778811026237*Rpc*(Ca*P*kf8 + Ca*Pg*kf11 - Kd11*Pcg*kf11 - Pc*kr8)
        time: '1'
      params:
        Compartment: ${Compartment}
        Ls: ${Ls}
        ts: ${ts}
        PIP2: ${PIP2}
        kf1: ${kf1}
        Kd1: ${Kd1}
        kf2: ${kf2}
        Kd2: ${Kd2}
        kf3: ${kf3}
        kr3: ${kr3}
        kf4: ${kf4}
        Kd4: ${Kd4}
        kf5: ${kf5}
        kf6: ${kf6}
        kf7: ${kf7}
        kf8: ${kf8}
        kr8: ${kr8}
        kf9: ${kf9}
        kr9: ${kr9}
        kf10: ${kf10}
        kr10: ${kr10}
        kf11: ${kf11}
        Kd11: ${Kd11}
        kf12: ${kf12}
        kf13: ${kf13}
        kf14: ${kf14}
        Km14: ${Km14}
        kf15: ${kf15}
        Km15: ${Km15}
        kf16: ${kf16}
        Vc: ${Vc}
        Rpc: ${Rpc}
      state_vars:
      - Gd
      - Gt
      - R
      - Rl
      - Rg
      - Rlg
      - Rlgp
      - IP3
      - Pc
      - Pcg
      - P
      - Pg
      - Ca
      - time
      input_vars: []
      method: ${method}
      rtol: ${rtol}
      atol: ${atol}
    interval: 0.5
    inputs:
      Gd:
      - stores
      - Gd
      Gt:
      - stores
      - Gt
      R:
      - stores
      - R
      Rl:
