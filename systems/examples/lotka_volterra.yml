# Data-driven: recover predator-prey structure from trajectories (lv.csv,
# generated by make_lv_csv.py), with qualitative oscillation as a check.
name: lotka_volterra
time: {t_end: 20, n_points: 401}
variables:
  y:
    - {name: x, value: 2.0, bounds: [0, null]}
    - {name: y, value: 1.0, bounds: [0, null]}
data:
  path: lv.csv
  time_column: t
  columns: {x: prey, y: predator}
behavior:
  description: Prey and predator cycle out of phase without damping.
  features:
    - {kind: oscillation, var: x, period: 6.7, tol: 0.05, sustained: true}  # measured from lv.csv
    - {kind: bounds, var: y, min: 0.0}
candidates:
  - {motif: lotka_volterra, bind: {prey: x, predator: y}}
