report:
  verdict: passing-with-caveats
  confidence: medium
  evidence_quality: regression
  main_insight: An SBML model imported into the expression layer integrates to libroadrunner's 
    trajectory, states and outputs, up to integrator error.
  caveat: libroadrunner 2.10.0 on macOS arm64 only; 8 feature-chosen models; t = 0 not compared; 
    cost not measured.
  key_metrics:
  - label: v2 H1 worst tight error / tau
    value: 4.6e-9 / 1e-7 (BIOMD5); <= 3.5e-9 / 1e-8 others
    status: pass
  - label: v2 H2 convergence
    value: 3.38-4.36 orders (>= 2.5)
    status: pass
  - label: v2 H3 median-sensitivity controls (+1%)
    value: 8/8 detected (>= 2.2e-3)
    status: pass
conclusion: >
  Second pass (v2, pre-registered 542bf96, single environment d719575): on 8 BioModels the /sbml-system
  import run by OdeProcess matches libroadrunner on the original SBML, states and Tellurium-emitted outputs,
  within 1e-8 of scale (1e-7 for BIOMD5) at tight tolerances. The default-tolerance gap shrinks by 3.4-4.4
  orders, so it is integrator error, mostly CVODE's. Median-sensitivity parameter changes of 1% are detected
  in every model. The first pass was superseded: it hid an importer clock bug (fixed in v0.3.0) and mixed
  three environments. Caveats: libroadrunner 2.10.0 on macOS arm64 only (the lock does not install on
  Linux arm64), 8 feature-chosen models, t = 0 not compared, cost not measured.
discovery_implications:
  resolved_uncertainties:
  - The importer's species and output semantics, including the exact model clock for time-dependent 
    models, match libroadrunner on the 8 feature-covering models, run through the workbench.
  remaining_uncertainties:
  - Agreement on a corpus sample (the corpus-coverage study).
  - Integration cost, separated from start-up.
  - libroadrunner versions other than 2.10.0.
  - t = 0 under the workbench (viva-tellurium#7).
  followup_study_proposals:
  - title: corpus-coverage
    motivation: A pre-registered BioModels range, so the claim rests on a sample and reports import,
      reject and agreement rates.
  - title: bench-copasi
    motivation: The second comparator, on the same 8 models.
  - title: bench-cost
    motivation: In-process timing (best of N, load and integration separated) before any cost claim.
preregistration:
  v1:
    registered: '2026-10-04'
    commit: 8488a1e
    text: the `hypothesis` field (unchanged)
    verdict: H1, H2 and H3 held on the first pass (b06fd83). Kept as recorded; see amendments for 
      its defects.
  v2:
    registered: '2026-10-04'
    before_runs: Written before any v2 run (the second pass, after viva-expressions v0.3.0's exact 
      clock and reparse fixes).
    compared_set: 'Every OdeProcess state, PLUS every assignment-rule output that TelluriumProcess emits
      in its `parameters` map. (v1 excluded outputs, which hid the time-clock bug: BIOMD400 outputs were
      off by 1.8e-2.) Boundary-species outputs that Tellurium doesn''t emit stay excluded, as stated.

      '
    metric: 'As in v1: per variable, max_t |ode - tel| / max_t |tel| (scale floor 1e-10); any non-finite
      value fails.'
    H1: 'Tight-tolerance agreement (rtol 1e-12 / atol 1e-14) within tau_m for every model: tau = 1e-8,
      except BIOMD5, where tau = 1e-7. Rationale: v1''s 1e-6 had low power (adversarial panel: 9 of 199
      parameters could change by 0.1% undetected). The observed tight errors were <= 4.6e-9, and the solvers''
      own floor is ~1e-8 (each solver at rtol 1e-12 vs 1e-13: LSODA 9.4e-9, CVODE 5.9e-9 on BIOMD5). tau
      sits a factor 10 above each floor.

      '
    H2: 'Integrator error, asserted as convergence: for every model, log10(worst default / worst tight)
      >= 2.5. v1''s `default >= tight` passed even with a planted semantic error (the ratio collapsed
      to 3-21x), while the first pass observed 3.4-4.4 orders.

      '
    H3: 'Negative controls that span sensitivity: for each model, rank its global parameters by roadrunner
      sensitivity on the ORIGINAL SBML, i.e. the oracle side, independent of the comparison (sensitivity
      = metric of the trajectory under a +1e-3 relative change, divided by 1e-3), and take the median-sensitivity
      parameter p_m. Perturbing p_m by +1% in the OdeProcess import must exceed tau_m. The procedure is
      analysis/select_controls.py, run and committed before the v2 runs. The v1 control (BIOMD12 eff +0.1%)
      is kept.

      '
    t0: t = 0 is compared if viva-tellurium#7 (empty first row) is fixed by the time of the re-run; 
      otherwise it stays excluded and is stated as such.
    environment: All v2 runs come from ONE commit and lock. Per-run provenance (workspace commit, 
      lock hash, env_id) is taken from runs_meta.manifest_json, not written by hand.
