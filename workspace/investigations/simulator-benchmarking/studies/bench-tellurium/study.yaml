pipeline_gate:
  gate_evaluator:
    result: not_started
    blocked_by: []
    evaluated_by: code
    diverges_from_authored: false
claim: 'Eight BioModels imported with /sbml-system (v0.3.0) and run by OdeProcess reproduce libroadrunner
  on the original SBML, states and model outputs, within 1e-8 of scale (BIOMD5: 1e-7) at tight tolerances.
  The default-tolerance gap converges away as integrator error.'
findings:
- id: h1-tight-agreement
  kind: methodological
  status: confirms
  statement: 'H1 holds. At rtol 1e-12 / atol 1e-14 every compared state of all 8 models agrees with libroadrunner
    within 1e-6 of its scale. Worst per model: BIOMD5 4.6e-9, 10 1.6e-10, 12 2.8e-10, 41 9.6e-12, 254
    1.3e-10, 400 5.5e-11, 700 9.9e-11, 1000 2.4e-10.

    '
  evidence:
    from_test: tests/test_agreement.py
    workbench: vivarium-workbench 3e5edbe8
    simulators: viva-expressions 0.2.3 OdeProcess (scipy LSODA); viva-tellurium 0.1.1 / tellurium 
      2.2.13.1 / libroadrunner 2.10.0 (CVODE)
    platform: macOS arm64, Python 3.12
    observed: worst 4.62e-09 (BIOMD5, M)
    test: 'test_h1_tight_tolerance_agreement[*]: 8/8 passed'
  obsoleted_by: v2-h1-tight-within-tau
  explanation: First pass (v1), superseded. Its runs came from three environments (see amendments), 
    and the integrated-clock importer defect hid wrong time-switched outputs.
- id: h2-integrator-error
  kind: methodological
  status: confirms
  statement: 'H2 holds. At the default tolerances (rtol 1e-8, atol 1e-10) the worst disagreement is 2.5e-8
    to 1.3e-5 (BIOMD5, an oscillator), and it always exceeds the tight-tolerance value by 2 to 4 orders
    of magnitude. That is integrator error, not a semantic difference. Default-tolerance agreement is
    therefore about 1e-5 for oscillators, not 1e-8.

    '
  evidence:
    from_test: tests/test_agreement.py
    workbench: vivarium-workbench 3e5edbe8
    simulators: viva-expressions 0.2.3 OdeProcess (scipy LSODA); viva-tellurium 0.1.1 / tellurium 
      2.2.13.1 / libroadrunner 2.10.0 (CVODE)
    platform: macOS arm64, Python 3.12
    observed: default worst 1.28e-05 (BIOMD5) vs tight 4.62e-09
    test: 'test_h2_default_disagreement_is_integrator_error[*]: 8/8 passed'
  obsoleted_by: v2-h2-convergence
  explanation: First pass (v1), superseded. Its runs came from three environments (see amendments), 
    and the integrated-clock importer defect hid wrong time-switched outputs.
- id: h3-negative-control
  kind: methodological
  status: confirms
  statement: 'H3 holds. Raising one BIOMD12 parameter by 0.1% (eff 20 -> 20.02) produces a 1.09e-3 disagreement,
    about 1000 times the threshold. A modelling difference this small is detected.

    '
  evidence:
    from_test: tests/test_agreement.py
    workbench: vivarium-workbench 3e5edbe8
    simulators: viva-expressions 0.2.3 OdeProcess (scipy LSODA); viva-tellurium 0.1.1 / tellurium 
      2.2.13.1 / libroadrunner 2.10.0 (CVODE)
    platform: macOS arm64, Python 3.12
    observed: 1.09e-03 (PY)
    test: 'test_h3_negative_control_is_detected: passed'
  obsoleted_by: v2-h3-median-controls
