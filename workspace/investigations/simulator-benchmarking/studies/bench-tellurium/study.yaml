title: OdeProcess (SBML import) vs viva-tellurium on 8 BioModels
investigation: simulator-benchmarking
question: 'Does a BioModels SBML model, imported into the expression layer and integrated by OdeProcess,
  reproduce viva-tellurium (libroadrunner, CVODE) running the original SBML file, and at what computational
  cost?

  '
hypothesis: 'Pre-registered before any run. (H1) At tight tolerances (rtol 1e-12, atol 1e-14 on both sides)
  every compared variable of all 8 models agrees within 1e-6 of its scale, measured as max over time of
  |OdeProcess - Tellurium| / max|Tellurium| after converting Tellurium''s species amounts into the importer''s
  units. (H2) At the default tolerances (rtol 1e-8, atol 1e-10) the disagreement is integrator error,
  so it is never smaller than at tight tolerances. (H3) Negative control: changing one parameter by 0.1%
  (BIOMD12 eff, 20 -> 20.02) pushes the disagreement above 1e-6, so the check can detect a small modelling
  difference. Cost is measured (wall time per run), not hypothesised.

  '
objective: 'Run each of 8 pinned BioModels two ways, as the /sbml-system import in OdeProcess and as the
  original SBML in TelluriumProcess, on the same 0.5-unit interval over t = 0..100 (the workbench run
  length `steps: 100` is a time horizon; 201 samples), at default and tight tolerances. Then measure the
  trajectory agreement and the run cost.

  '
description: 'The models (BIOMD5, 10, 12, 41, 254, 400, 700, 1000) were chosen to cover distinct SBML
  features: boundary species, local parameters, hasOnlySubstanceUnits, two compartments of different sizes,
  rate rules only, a time-dependent piecewise model, function definitions, and initial assignments. Their
  files are pinned by SHA-256 under the investigation''s inputs/models. The Tellurium side reports species
  amounts (roadrunner''s bare-id selection), and the OdeProcess side integrates each species in its symbol''s
  units, a concentration unless hasOnlySubstanceUnits. The comparison converts with the compartment sizes
  from the SBML, so a units mismatch cannot pose as disagreement. Both simulators restart integration
  at each interval from the previous state.

  '
