limitations:
- 'Platform: libroadrunner 2.10.0 / tellurium 2.2.13.1 on macOS arm64. The lock pins libroadrunner 2.10.0,
  which has no Linux aarch64 wheel (PyPI only ever shipped one for 2.7.0), so `uv sync` of this lock FAILS
  on Linux arm64 and no linux/arm64 image is built (viva-template#65). Results are not claimed for libroadrunner
  2.7.0 or any other version.'
- "t = 0 is not compared: TelluriumProcess emits an empty first row (viva-tellurium#7). The importer's
  tests check initial values separately. For BIOMD41, 98.9-100% of each species' transient lies in [0,
  0.5], so the comparison mostly covers its slow drift."
- 'Compared set: states, plus the assignment outputs that Tellurium emits. Boundary-species outputs (BIOMD5
  YT/CT, BIOMD700) are not emitted by TelluriumProcess and are not compared here; a continuous roadrunner
  run agrees with them (panel: 2.6e-9, 1e-11).'
- "Coverage: none of the 8 models has a rate-rule-parameter state, and hasOnlySubstanceUnits appears only
  in a size-1 compartment (BIOMD12). Those conversions are covered by the importer's hand-built tests,
  not by this study."
- 'Sample: 8 models chosen for SBML-feature coverage, not sampled. Even if they were a random sample,
  0 failures in 8 would only bound the corpus failure rate at <= 31% (95%). The corpus-coverage study
  addresses this.'
- 'Detection: tau_m bounds trajectory disagreement, not parameter error. Some parameters move the trajectories
  so little that a 0.1% change in them stays under 1e-6 (panel: 9 of 199).'
- Both simulators restart integration each 0.5 interval. Chunked and continuous roadrunner differ by
  up to 9.9e-9 (BIOMD5), and H1 v1 also holds against a continuous run (panel).
- Cost is not measured (one run per entry; start-up-dominated wall time).
