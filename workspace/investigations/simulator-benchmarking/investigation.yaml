description: 'Does the expression layer reproduce established simulators? Compares
  OdeProcess (viva-expressions) against viva-tellurium, viva-copasi and viva-pysces
  on the same models, ideally sourced from BioModels via viva-biomodels. One study
  per model class: kinetics, oscillator, and a stiff case. Shared question: trajectory
  agreement and computational cost. Practical outcome: guidance on when users should
  write expressions vs. wrap an SBML model.

