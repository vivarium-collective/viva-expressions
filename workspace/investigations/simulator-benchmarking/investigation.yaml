schema_version: 2
name: simulator-benchmarking
title: Does the expression layer reproduce established simulators?
created: '2026-10-03'
status: running
runtime:
  default_emitter: sqlite
description: >
  One study per comparator, all on the same 8 pinned BioModels (inputs/models, SHA-256 pinned) and the
  same settings: 0.5 interval, t = 0..100, default tolerances (rtol 1e-8, atol 1e-10) and tight ones (1e-12
  / 1e-14). The OdeProcess side is the /sbml-system import of each model. The comparator runs the original
  SBML. Started with bench-tellurium (viva-tellurium is installed). bench-copasi and bench-pysces follow
  once their wrappers are installed. Practical outcome: guidance on when to write expressions and when
  to wrap an SBML model.
studies: []
expert_docs: []
acceptance_criteria: []
members:
- bench-tellurium
question: >
  Does a model defined in the viva-expressions layer (OdeProcess), here imported from BioModels SBML with
  /sbml-system, reproduce established SBML simulators (viva-tellurium, viva-copasi, viva-pysces) on the
  same models, and at what cost?
hypothesis: >
  Each comparator agrees with OdeProcess within 1e-6 of scale at tight tolerances, with any default-tolerance
  gap explained by integrator error. Each comparator study pre-registers its own thresholds.
executive:
  what_is_this: Simulator benchmarking of the expression layer against established SBML simulators, 
    one study per comparator.
  verdict: bench-tellurium v2 passes its pre-registered tests. On 8 BioModels the imported 
    OdeProcess models match libroadrunner, states and model outputs, within 1e-8 of scale (1e-7 for 
    BIOMD5) at tight tolerances. The default-tolerance gap converges away (3.4-4.4 orders), so it is
    integrator error.
  verdict_status: in-progress
  verdict_detail: 1 of 3 comparator studies done (Tellurium), on a second, single-environment pass 
    after an importer clock bug found by the adversarial panel was fixed (viva-expressions v0.3.0). 
    COPASI and PySCeS are not yet installed.
  decisions_needed:
  - question: Install viva-copasi and viva-pysces for the next comparator studies?
    context: bench-tellurium's design (models, settings, tests) is reusable as is.
scientific_argument:
  main_claim: The expression layer, fed by /sbml-system imports, reproduces libroadrunner's 
    integration of the same SBML (states and outputs) up to integrator error, on 8 feature-chosen 
    BioModels.
  evidence_for:
  - 'bench-tellurium v2 H1: 8/8 models within tau (1e-8, or 1e-7 for BIOMD5) at tight tolerances over
    129 states and outputs; worst 4.6e-9.'
  - 'bench-tellurium v2 H2: the default-to-tight drop is 3.38-4.36 orders (pre-registered >= 2.5), so
    the gap is integrator error.'
  - 'bench-tellurium v2 H3: +1% median-sensitivity parameter changes are detected in 8/8 models (>= 2.2e-3).'
  evidence_against:
  - "First pass (superseded): with the integrated clock, BIOMD400's time-switched outputs were off by
    1.8e-2. Fixed in v0.3.0, and the v2 runs confirm the fix (3.5e-9)."
  key_figures: []
  caveats:
  - 'arm64 disparity: all results use libroadrunner 2.10.0 on macOS arm64. The lock pins 2.10.0, which
    has no Linux aarch64 wheel (PyPI only ever shipped one for 2.7.0), so the lock does not install on
    Linux arm64 and no linux/arm64 image is built (viva-template#65). Other libroadrunner versions are
    untested.'
  - 8 models chosen for SBML-feature coverage, not sampled (0/8 failures would bound a corpus 
    failure rate at <= 31% even if they were sampled); the corpus-coverage study addresses this. The
    importer rejects models with events, delays or algebraic rules.
  - 'Cost is not yet measured: workbench wall time is dominated by process start-up.'
  - 't = 0 is not compared under the workbench (viva-tellurium#7: empty first row).'
narrative_spine_skip:
- biological_story
narrative_spine_skip_reason: Methods investigation (simulator equivalence); it makes no biological 
  claim.
at_a_glance:
- study: bench-tellurium
  role: 'OdeProcess (SBML import) vs viva-tellurium on 8 BioModels: passes H1-H3.'
