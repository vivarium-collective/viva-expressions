question: Does the expression-defined OdeProcess reproduce closed-form solutions and
  conserved quantities within numeric error bands across solver methods, tolerances
  and stiff regimes, and does its max_abs guard fail loudly at a finite-time singularity?
hypothesis: At the default tolerances (rtol=1e-8, atol=1e-10) every analytic baseline
  lands within a relative error of 1e-6 of its oracle for every method. Error grows
  with rtol but stays inside a band set by that rtol. dx/dt = x**2 raises the max_abs
  RuntimeError at t = 1/x0 instead of stalling.
