amendments:
- date: '2026-10-06'
  what: quadratic_blowup runs superseded (pre-#1292 records)
  detail: 'The 3 quadratic_blowup runs of 2026-10-05 (quadratic_blowup__1791229344__ee0dda,
    blowup_low_guard __1791230421__debfc2, blowup_x0_2 __1791230427__c041b9) are recorded
    completed (n_steps 5), but the composite raised the OdeProcess max_abs RuntimeError:
    vivarium-workbench before ea66f51b (#1293, fixing #1292) treated any raise as
    division and recorded the run completed. They are kept as evidence of that bug,
    not used. Re-run 2026-10-06 on workbench ea66f51b as __1791290688__5fc1bd, __1791290692__b5b395
    and __1791290694__a14f23: all three are status failed in runs.db runs_meta, with
    the expected error (|state| exceeded max_abs = 1e12 / 1000 / 1e12, raised at global_time
    0.9 / 0.9 / 0.4, consistent with the analytic blow-up time 1/x0 = 1 / 1 / 0.5).
    The workbench writes failed runs to runs.db only (not to runs[] here). Their n_steps
    0 is correct: n_steps counts whole time units of global_time completed, and each
    run raised before t = 1.'
- date: '2026-10-06'
  what: analysis choices made after the runs (metric, band, readouts, tests)
  detail: 'The 2026-10-05 runs predate tests/test_analytic.py. Fixed before any error
    was computed, with the user: (1) metric = pointwise relative error max_t |q -
    q*| / |q*| over every emitted time (the hypothesis names "relative error"; every
    compared oracle stays away from zero on t = 0..5); MM P is checked through S +
    P = S0 because P(0) = 0; LV is checked through its first integral V against V(0);
    MM S* uses Km*wrightomega(.) = Km*W(e^u) to avoid overflow at Km = 1e-4. (2) band
    = err <= 100*rtol (the multiplier the hypothesis implies: 1e-6 at rtol 1e-8),
    plus err(tight) <= err(default) <= err(loose) per model for "error grows with
    rtol". readouts[] added; /api/study-observable-check validates only against baseline[0]
    (vivarium-workbench observables_views.py:244), so mm_*/lv_*/blowup_x read not_in_structure
    there although /api/observables lists stores.S, stores.P, stores.x, stores.y,
    stores.x as emitted leaves of their own composites.'
- date: '2026-10-06'
  what: H2 ordering fails for Lotka-Volterra (confounded ladder)
  detail: 'The LV rtol ladder is (lv_rtol_tight LSODA 1e-11, lotka_volterra LSODA
    1e-8, lv_rk45_loose RK45 1e-4). Worst relative error over x, y (against a DOP853
    rtol 1e-13 reference) and V: 1.59e-10, 1.81e-7, 2.58e-9, so err(default) > err(loose)
    (V drift alone: 3.29e-11, 4.51e-8, 1.63e-10). Reproduced outside the workbench
    with scipy solve_ivp restarted on 0.1-wide intervals as OdeProcess does: RK45
    rtol 1e-4 gives 1.629e-10 (matches), i.e. with 0.1-long restarts RK45 accuracy
    is bounded by the interval, not by rtol. The loose rung also switches method,
    so this ladder does not isolate rtol. Reported as a failed test and an open question,
    not patched. Every run is inside its 100*rtol band; H1 and H3 pass.'
- date: '2026-10-06'
  what: adversarial review of tests/test_analytic.py (scope and fixes)
  detail: 'A fresh-context review found the LV checks used only the first integral
    V, which a frozen or time-rescaled trajectory also conserves (mutations passed).
    Fixed before any finding was written: LV x and y are now compared with a DOP853
    rtol 1e-13 reference solve (no closed form exists), and both mutations fail. The
    recorded blow-up runs are now tied to t* through their stored history (last time
    < 1/x0 <= last time + interval; last state matches x0/(1-x0 t)), not only their
    failed status. Scope limits: on t = 0..5 the mm_stiff_* variants are not yet stiff
    (|dS''/dS| <= 4e-6; stiffness appears near t ~ 10); S + P = S0 is a structural
    check (exact-negative right-hand sides), not accuracy evidence; LV with RK45 at
    default tolerances is not run. A stalled guard would hang the in-process H3 test
    rather than fail it, because no pytest timeout is configured.'
- date: '2026-10-06'
  what: second LV rtol ladder, fixed before its runs
  detail: 'With the user, after the confounded LV ladder failed: two variants are
    added before they are run. lv_lsoda_loose (LSODA, rtol 1e-4, atol 1e-6) gives
    an LSODA-only ladder (lv_rtol_tight, lotka_volterra, lv_lsoda_loose) for H2''s
    ordering; lv_rk45 (RK45 at the default rtol 1e-8, atol 1e-10) closes the gap of
    LV with RK45 at the default tolerances (H1). Both are held to the same band (err
    <= 100*rtol) and metric. The confounded ladder stays in the tests and is still
    reported.'
