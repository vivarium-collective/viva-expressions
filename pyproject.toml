[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viva-expressions"
version = "0.1.0"
description = "Assemble process-bigraph models of dynamical systems from expected outputs and behavior"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "process-bigraph>=1.8.5",
    "pyyaml>=6",
    "scipy>=1.13",
    "sympy>=1.13",
    "bigraph-schema",
    "bigraph-viz>=2.0.3",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench[chat]",
    "viva_tellurium",
    "viva_biomodels",
]

[project.optional-dependencies]
notebooks = [
    "marimo>=0.25.1",
    "wigglystuff>=0.5.32",
]
sindy = [
    "pysindy>=2.1,<3",
]
dev = [
    "pysindy>=2.1,<3",
    "pytest>=8",
]

[dependency-groups]
dev = [
    "pysindy>=2.1,<3",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["viva_expressions"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
viva_biomodels = { path = "external/viva-biomodels", editable = true }
viva-tellurium = { git = "https://github.com/vivarium-collective/viva-tellurium.git", branch = "main" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
